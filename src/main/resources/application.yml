server:
  port: 8081

spring:
  application:
    name: citybus-tracker

  datasource:
    # File-based H2 keeps the demo zero-install while exercising real JPA.
    # Swap the URL for PostgreSQL in production; no code changes required.
    url: jdbc:h2:file:./data/citybus;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Cache policies are defined per-cache in CacheConfig (routes 10m, alerts 30s).

  # Virtual threads (Java 21): each request gets a cheap virtual thread instead
  # of tying up a platform-thread pool — hundreds of concurrent riders cost
  # kilobytes each. Set to false if running on Java 17.
  threads:
    virtual:
      enabled: true

app:
  jwt:
    # Override in any real deployment: set the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:citybus-dev-only-secret-key-change-me-0123456789abcdef}
    expiration-minutes: 480
  cors:
    allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.citybus: INFO
    org.springframework.web.socket: WARN
